name: fix-newlines
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip trailing newlines
        run: |
          python3 - <<'PY'
          for path in ["package.json", ".makefun/owner.json"]:
              data = open(path, "rb").read()
              if data.endswith(b"\n"):
                  open(path, "wb").write(data[:-1])
          PY
      - name: Commit if changed
        run: |
          git config user.name "Rahulboss7788"
          git config user.email "Rahulboss7788@users.noreply.github.com"
          git add package.json .makefun/owner.json
          git diff --cached --quiet || git commit -m "Strip trailing newlines"
          git push
